name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release executable
        run: cargo build --release
      - name: Install Inno Setup 7
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup.7 --exact --silent --accept-package-agreements --accept-source-agreements
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = @(
            (Join-Path $env:ProgramFiles 'Inno Setup 7\ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 7\ISCC.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 7\ISCC.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found in either Program Files directory.' }
          & $iscc 'installer\RecordScreen.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecordScreen-Setup-x64
          path: dist/RecordScreen-Setup-*-x64.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'dist\RecordScreen-Setup-*-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer artifact is missing.' }
          gh release create $env:GITHUB_REF_NAME $installer.FullName --generate-notes
