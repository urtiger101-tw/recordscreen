[package]
name = "recordscreen"
version = "0.1.3"
edition = "2021"
description = "Windows desktop screen recorder with a local agent control API"

[dependencies]
axum = "0.8"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
rand = "0.9"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
