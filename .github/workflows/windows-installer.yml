name: Windows installer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked
      - name: Build release executable
        run: cargo build --release --locked
      - name: Verify standalone Windows runtime linkage
        shell: pwsh
        run: ./scripts/check-runtime-dependencies.ps1
      - name: Install Inno Setup 7
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup.7 --exact --silent --accept-package-agreements --accept-source-agreements
      - name: Compile installer
        id: package
        shell: pwsh
        run: |
          $version = (Get-Item -LiteralPath 'target\release\recordscreen.exe').VersionInfo.ProductVersion
          if (-not $version) { throw 'Release executable has no product version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match binary version $version."
          }
          $iscc = @(
            (Join-Path $env:ProgramFiles 'Inno Setup 7\ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 7\ISCC.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 7\ISCC.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found in either Program Files directory.' }
          & $iscc 'installer\RecordScreen.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "dist/RecordScreen-Setup-$version-x64.exe"
          $digest = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $(Split-Path -Leaf $installer)" | Set-Content -LiteralPath "$installer.sha256" -Encoding ascii
          "installer=$installer" >> $env:GITHUB_OUTPUT
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecordScreen-Setup-x64
          path: |
            ${{ steps.package.outputs.installer }}
            ${{ steps.package.outputs.installer }}.sha256
          if-no-files-found: error

  publish-release:
    if: github.ref_type == 'tag'
    needs: build-installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RecordScreen-Setup-x64
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $installer = "RecordScreen-Setup-$version-x64.exe"
          gh release create $env:GITHUB_REF_NAME $installer "$installer.sha256" --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes
